<h2>变量命名功能：出发与输入方式</h2>
<p class="subtitle">选择最符合你操作习惯的触发方式</p>

<div class="section">
  <h3>1. 触发命令 (Trigger Command)</h3>
  <div class="options" data-choice="trigger">
    <div class="option" data-choice="/var" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>/var</h3>
        <p>简洁明确，代表变量命名</p>
      </div>
    </div>
    <div class="option" data-choice="/naming" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>/naming</h3>
        <p>直白好懂，适合新手</p>
      </div>
    </div>
    <div class="option" data-choice="/n" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>/n</h3>
        <p>极简主义，高频用户的最爱</p>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>2. 输入源 (Input Source)</h3>
  <div class="options" data-choice="input-source">
    <div class="option" data-choice="text-input" onclick="toggleSelect(this)">
      <div class="letter">D</div>
      <div class="content">
        <h3>手动输入</h3>
        <p>在翻译框中输入中文描述（如：用户登录），自动生成对应的变量名</p>
      </div>
    </div>
    <div class="option" data-choice="selection" onclick="toggleSelect(this)">
      <div class="letter">E</div>
      <div class="content">
        <h3>划词/超级面板</h3>
        <p>选中一段中文，直接通过 uTools 超级面板触发命名建议</p>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <p class="subtitle">你可以选择一个命令和一个或多个输入源。</p>
</div>
