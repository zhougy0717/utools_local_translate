<h2>Ollama 模式选择确认</h2>
<p class="subtitle">当你在 /mode 中点击 "Ollama (LLM)" 时，你希望看到什么样的二级菜单？</p>

<div class="options">
  <div class="option" data-choice="current" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>当前实现 (两项式)</h3>
      <p>1. 确认启用 Ollama 翻译模式</p>
      <p>2. 打开 Ollama 配置面板</p>
      <p class="label">简单直接</p>
    </div>
  </div>
  <div class="option" data-choice="enhanced" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>增强确认 (带状态检测)</h3>
      <p>1. <b>确认启动 (正在检查状态...)</b> - 实时告诉你 Ollama 是否在线</p>
      <p>2. 打开详细配置界面</p>
      <p>3. <i>(可选) 快速切换模型 (列出常用模型)</i></p>
      <p class="label">反馈更明确</p>
    </div>
  </div>
</div>
