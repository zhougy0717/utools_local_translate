<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ollama 进阶翻译中心</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #334155;
      --border-color: #e2e8f0;
      --header-bg: #f8fafc;
      --sidebar-bg: #f1f5f9;
      --accent-color: #2563eb;
      --text-muted: #64748b;
    }
    
    body, html {
      margin: 0; padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .advanced-container {
      display: flex; flex-direction: column; height: 100vh; background: var(--bg-color); color: var(--text-main);
    }

    .toolbar {
      height: 52px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; background: var(--header-bg); border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .brand { font-weight: 600; color: #1e293b; font-size: 15px; }

    .controls { display: flex; gap: 8px; align-items: center; }
    .control-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    select {
      background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; font-size: 13px; color: #64748b; outline: none;
    }

    .btn-execute {
      background: var(--accent-color); color: white; border: none; border-radius: 4px; 
      padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.2s;
    }
    .btn-execute:hover { opacity: 0.9; }
    .btn-execute:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-config { font-size: 18px; cursor: pointer; margin-left: 5px; opacity: 0.7; }
    .btn-config:hover { opacity: 1; }

    .content-wrapper { flex: 1; display: flex; overflow: hidden; }

    .sidebar { width: 130px; background: var(--sidebar-bg); padding: 12px; border-right: 1px solid var(--border-color); }
    .nav-item { 
      padding: 8px 12px; border-radius: 4px; margin-bottom: 4px; cursor: pointer; 
      font-size: 13px; font-weight: 500; color: var(--text-muted); transition: all 0.2s;
    }
    .nav-item:hover { background: #e2e8f0; color: var(--text-main); }
    .nav-item.active { background: white; color: var(--accent-color); border: 1px solid var(--accent-color); box-shadow: 0 2px 4px rgba(37,99,235,0.1); }

    .editor-main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow-y: auto; }

    .pane { display: flex; flex-direction: column; gap: 6px; }
    .pane label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .text-display, textarea {
      background: #fcfcfc; border: 1px solid var(--border-color); border-radius: 6px; 
      padding: 12px; font-size: 14px; line-height: 1.6; color: var(--text-main);
    }
    textarea { height: 100px; resize: none; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(37,99,235,0.05); }

    .result-pane .text-display { 
      min-height: 120px; background: #f8fafc; border-style: dashed; overflow-wrap: break-word; white-space: pre-wrap;
    }

    /* 变量命名风格列表样式 */
    .naming-results-wrapper { display: none; flex-direction: column; gap: 12px; padding: 4px 0; }
    .naming-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 10px; }
    .naming-label { 
      width: 100px; flex-shrink: 0; display: flex; flex-direction: column; 
      line-height: 1.25; padding-top: 4px; border-left: 2px solid transparent; transition: border-color 0.2s;
    }
    .naming-row:focus-within .naming-label { border-color: var(--accent-color); }
    .naming-label-zh { font-size: 12px; color: var(--text-main); font-weight: 600; }
    .naming-label-en { font-size: 10px; color: var(--text-muted); font-family: sans-serif; font-weight: normal; }
    .naming-input-group { flex: 1; min-width: 300px; display: flex; align-items: center; gap: 6px; }

    .naming-value { 
      flex: 1; background: white; border: 1px solid var(--border-color); border-radius: 4px; 
      padding: 6px 10px; font-size: 13px; color: var(--text-main); font-family: monospace;
      outline: none; transition: border-color 0.2s;
    }
    .naming-value:focus { border-color: var(--accent-color); }
    .btn-copy {
      padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 4px;
      background: white; color: var(--text-muted); font-size: 11px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-copy:hover { border-color: var(--accent-color); color: var(--accent-color); background: #f0f7ff; }
    
    /* 变量命名候选建议标签样式 */
    .naming-suggestions-wrapper { 
      display: none; height: 32px; align-items: center; gap: 8px; 
      overflow-x: auto; padding: 2px 0 6px 0; margin-bottom: 6px;
      scrollbar-width: none; /* Firefox */
    }
    .naming-suggestions-wrapper::-webkit-scrollbar { display: none; }
    .suggestion-tag {
      padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 14px;
      background: white; color: var(--text-muted); font-size: 12px; cursor: pointer;
      white-space: nowrap; transition: all 0.2s;
    }
    .suggestion-tag:hover { border-color: var(--accent-color); color: var(--accent-color); }
    .suggestion-tag.active { background: var(--accent-color); color: white; border-color: var(--accent-color); box-shadow: 0 2px 4px rgba(37,99,235,0.2); }

    .footer-status { 
      height: 28px; padding: 0 15px; background: var(--header-bg); font-size: 11px; color: #64748b; 
      display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); 
    }

    .status-online { color: #10b981; }
    .status-offline { color: #ef4444; }

    /* Markdown 简单样式渲染模拟 */
    #result-text { font-size: 14px; }
  </style>
</head>
<body>
<div class="advanced-container">
    <header class="toolbar">
      <div class="brand">Ollama 进阶翻译中心</div>
      <div class="controls">
        <span id="lang-select-group">
          <span class="control-label">目标语言:</span>
          <select id="lang-select">
            <option value="auto">自动检测</option>
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </span>
        <span class="control-label">使用模型:</span>
        <select id="model-select">
          <option value="">正在获取模型...</option>
        </select>
        <button class="btn-execute" id="btn-execute">执行翻译</button>
        <span class="btn-config" id="btn-config" title="配置 Ollama">⚙️</span>
      </div>
    </header>

  <div class="content-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="nav-item active" data-task="advanced">进阶翻译</div>
      <div class="nav-item" data-task="naming">变量命名</div>
    </aside>

    <main class="editor-main">
      <section class="pane result-pane">
        <label id="result-label">翻译结果</label>
        
        <!-- 变量命名特有的多风格展示区 -->
        <div class="naming-results-wrapper" id="naming-results">
          <!-- 建议词标签区 -->
          <div class="naming-suggestions-wrapper" id="naming-suggestions">
            <!-- 动态注入标签 -->
          </div>
          
          <div class="naming-row">
            <div class="naming-label">
                <span class="naming-label-zh">大驼峰</span>
                <span class="naming-label-en">PascalCase</span>
            </div>
            <div class="naming-input-group">
              <input type="text" class="naming-value" id="naming-pascal" readonly placeholder="等待生成..." onclick="this.select()">
              <button class="btn-copy" id="copy-pascal">复制</button>
            </div>
          </div>
          <div class="naming-row">
            <div class="naming-label">
                <span class="naming-label-zh">小驼峰</span>
                <span class="naming-label-en">camelCase</span>
            </div>
            <div class="naming-input-group">
              <input type="text" class="naming-value" id="naming-camel" readonly placeholder="等待生成..." onclick="this.select()">
              <button class="btn-copy" id="copy-camel">复制</button>
            </div>
          </div>
          <div class="naming-row">
            <div class="naming-label">
                <span class="naming-label-zh">下划线</span>
                <span class="naming-label-en">snake_case</span>
            </div>
            <div class="naming-input-group">
              <input type="text" class="naming-value" id="naming-snake" readonly placeholder="等待生成..." onclick="this.select()">
              <button class="btn-copy" id="copy-snake">复制</button>
            </div>
          </div>
          <div class="naming-row">
            <div class="naming-label">
                <span class="naming-label-zh">常量名</span>
                <span class="naming-label-en">CONSTANT_CASE</span>
            </div>
            <div class="naming-input-group">
              <input type="text" class="naming-value" id="naming-constant" readonly placeholder="等待生成..." onclick="this.select()">
              <button class="btn-copy" id="copy-constant">复制</button>
            </div>
          </div>
          <div class="naming-row">
            <div class="naming-label">
                <span class="naming-label-zh">短横线</span>
                <span class="naming-label-en">kebab-case</span>
            </div>
            <div class="naming-input-group">
              <input type="text" class="naming-value" id="naming-kebab" readonly placeholder="等待生成..." onclick="this.select()">
              <button class="btn-copy" id="copy-kebab">复制</button>
            </div>
          </div>
        </div>
        
        <div class="text-display" id="result-text">等待翻译...</div>
      </section>

      <section class="pane source-pane">
        <label>原文 (可编辑)</label>
        <textarea id="source-input" placeholder="输入或精修待翻译原文..."></textarea>
      </section>

      <section class="pane prompt-pane">
        <label>提示词提示 (可编辑)</label>
        <textarea id="prompt-input" placeholder="输入翻译指令，使用 [TEXT] 指定原文注入位置..."></textarea>
      </section>
    </main>
  </div>
  
  <footer class="footer-status">
    <div id="connection-status"><span class="status-offline">●</span> Ollama 状态未知</div>
    <div id="token-usage">Token: 0 | 就绪</div>
  </footer>
</div>

<script src="advanced-renderer.js"></script>
</body>
</html>
