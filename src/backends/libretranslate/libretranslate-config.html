<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 24px 32px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #24292e;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }
        .config-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .header-status-text {
            font-size: 13px;
            color: #586069;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: all 0.3s;
        }
        .status-dot.online { background: #2ea44f; box-shadow: 0 0 8px rgba(46,164,79,0.4); }
        .status-dot.offline { background: #d73a49; box-shadow: 0 0 8px rgba(215,58,73,0.4); }
        .status-dot.loading { background: #f9b115; }

        .form-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #586069;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 4px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: flex-end;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .flex-2 { flex: 2; }
        .flex-auto { flex: 0 0 auto; }
        
        label {
            font-size: 13px;
            font-weight: 600;
        }
        input, select {
            padding: 7px 12px;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            background-color: #fafbfc;
            font-size: 14px;
            color: #24292e;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #0366d6;
            box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.1);
            background-color: #fff;
        }

        .notice-card {
            background-color: #f1f8ff;
            border: 1px solid #c8e1ff;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .notice-icon { font-size: 18px; margin-top: 2px; }
        .notice-content { flex: 1; font-size: 13px; line-height: 1.5; color: #24292e; }
        .notice-content b { color: #0366d6; display: block; margin-bottom: 2px; }
        .notice-content span { color: #586069; }
        
        .notice-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .proxy-status-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e2e8f0;
            color: #475569;
        }
        .proxy-status-tag.active {
            background: #dcfce7;
            color: #166534;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 18px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s; border-radius: 18px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 12px; width: 12px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2ea44f; }
        input:checked + .slider:before { transform: translateX(18px); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            height: 34px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #d1d5da;
            background-color: #f3f4f6;
            color: #24292e;
            transition: all 0.2s;
        }
        .btn:hover { background-color: #e1e4e8; }
        .btn-refresh { min-width: 34px; }
        
        #test-message {
            margin-top: 12px;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            display: none;
        }
        .msg-success { display: block !important; background: #f0fdf4; color: #166534; border: 1px solid #bbfcce; }
        .msg-error { display: block !important; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="config-container">
        <header>
            <div class="header-left">
                <h2>LibreTranslate 配置</h2>
                <div class="header-status-text">
                    <div id="status-dot" class="status-dot"></div>
                    <span id="status-text">检查中...</span>
                </div>
            </div>
        </header>

        <div class="form-section">
            <div class="section-title">接口与凭据</div>
            <div class="form-row">
                <div class="form-group flex-2">
                    <label>API Base URL</label>
                    <input type="text" id="apiBase" placeholder="http://127.0.0.1:5000">
                </div>
                <div class="form-group flex-2">
                    <label>API Key (可选)</label>
                    <input type="text" id="apiKey" placeholder="密钥/API Key">
                </div>
                <div class="form-group flex-auto">
                    <button class="btn btn-refresh" id="btn-save" title="测试并保存配置">✔️</button>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>默认源语言 (Source)</label>
                    <select id="sourceLang">
                        <option value="auto">自动检测 (Auto Detect)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>默认目标语言 (Target)</label>
                    <select id="targetLang">
                        <option value="zh">简体中文 (Chinese Simplified)</option>
                    </select>
                </div>
                <div class="form-group flex-auto">
                    <button class="btn btn-refresh" id="btn-refresh-langs" title="重新获取语言列表">🔄</button>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">分流与代理</div>
            <div class="notice-card">
                <span class="notice-icon">🌐</span>
                <div class="notice-content">
                    <b>网络代理模式</b>
                    <span>推荐在访问受限的公开实例时开启。点击前往 <a href="#" id="btn-config-proxy" style="color: #0366d6; text-decoration: underline;">全局代理配置</a></span>
                </div>
                <div class="notice-action">
                    <span id="proxy-label" class="proxy-status-tag">OFF</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="useProxy">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div id="test-message"></div>
    </div>

    <!-- RENDERER_JS -->
</body>
</html>
