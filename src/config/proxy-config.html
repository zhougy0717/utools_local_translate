<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局代理设置</title>
    <link rel="stylesheet" href="proxy-style.css">
</head>
<body>
    <div class="container">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-globe"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            全局代理设置
        </h1>

        <div class="form-group">
            <label class="checkbox-group" for="proxy-enabled">
                <input type="checkbox" id="proxy-enabled">
                <span>启用全局代理</span>
            </label>
        </div>

        <div id="proxy-fields">
            <div class="input-row">
                <div class="form-group col-type">
                    <label for="proxy-type">类型</label>
                    <select id="proxy-type">
                        <option value="http">HTTP</option>
                        <option value="socks5">SOCKS5</option>
                    </select>
                </div>
                <div class="form-group col-host">
                    <label for="proxy-host">Host</label>
                    <input type="text" id="proxy-host" placeholder="127.0.0.1">
                </div>
                <div class="form-group col-port">
                    <label for="proxy-port">Port</label>
                    <input type="number" id="proxy-port" placeholder="1080" min="1" max="65535">
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-group" for="proxy-auth-enabled">
                    <input type="checkbox" id="proxy-auth-enabled">
                    <span>开启代理认证</span>
                </label>
            </div>

            <div id="auth-fields" style="padding-left: 20px; border-left: 2px solid #e1e4e8; margin-bottom: 20px;">
                <div class="form-group">
                    <label for="proxy-username">用户名</label>
                    <input type="text" id="proxy-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="proxy-password">密码</label>
                    <input type="password" id="proxy-password" placeholder="请输入密码">
                </div>
            </div>

            <div class="input-row">
                <div class="form-group col-test-url">
                    <label for="proxy-test-url">连通性测试 URL</label>
                    <input type="url" id="proxy-test-url" placeholder="https://www.google.com">
                </div>
                <div class="form-group col-test-btn">
                     <!-- 按钮放在 URL 右侧，移除 label 标签以对齐输入框 -->
                    <label style="visibility: hidden;">测试</label>
                    <button type="button" class="btn-primary" id="btn-test">一键测试连通性</button>
                </div>
            </div>
        </div>

        <div id="result-message"></div>

        <div class="button-group">
            <button type="button" class="btn-cancel" id="btn-cancel" style="font-size: 0.875rem;">取消</button>
            <button type="button" class="btn-secondary" id="btn-save" style="flex: 1.5; font-size: 0.95rem;">保存配置并退出</button>
        </div>
        <a href="#" id="back-to-dict" style="font-size: 0.875rem; color: #64748b; text-decoration: none; margin-top: 8px; display: block; text-align: center; flex-shrink: 0;">← 返回离线词典配置</a>
    </div>

    <script src="proxy-renderer.js"></script>
</body>
</html>
