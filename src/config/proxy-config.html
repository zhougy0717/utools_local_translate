<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局代理设置</title>
    <link rel="stylesheet" href="proxy-style.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div class="header-left">
                <button type="button" id="btn-back" style="display:none;" title="返回上一个配置页">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    返回
                </button>
                <div class="header-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-globe"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>全局代理设置</span>
                </div>
            </div>
        </div>

        <div id="proxy-fields">
            <div class="input-row">
                <div class="form-group col-type">
                    <label for="proxy-type">类型</label>
                    <select id="proxy-type">
                        <option value="http">HTTP</option>
                        <option value="socks5">SOCKS5</option>
                    </select>
                </div>
                <div class="form-group col-host">
                    <label for="proxy-host">Host</label>
                    <input type="text" id="proxy-host" placeholder="127.0.0.1">
                </div>
                <div class="form-group col-port">
                    <label for="proxy-port">Port</label>
                    <input type="number" id="proxy-port" placeholder="1080" min="1" max="65535">
                </div>
                <div class="form-group col-save">
                    <label style="visibility: hidden;">保存</label>
                    <button type="button" class="btn-primary" id="btn-save" title="立即保存并退出">✓</button>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-group" for="proxy-auth-enabled">
                    <input type="checkbox" id="proxy-auth-enabled">
                    <span>开启代理认证</span>
                </label>
            </div>

            <div class="form-group">
                <label class="checkbox-group" for="proxy-ssl-verify">
                    <input type="checkbox" id="proxy-ssl-verify">
                    <span>关闭证书校验 (若使用自签名证书代理，请勾选此项)</span>
                </label>
            </div>

            <div id="auth-fields" style="padding-left: 20px; border-left: 2px solid #e1e4e8; margin-bottom: 12px;">
                <div class="form-group">
                    <label for="proxy-username">用户名</label>
                    <input type="text" id="proxy-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="proxy-password">密码</label>
                    <input type="password" id="proxy-password" placeholder="请输入密码">
                </div>
            </div>

            <div class="input-row">
                <div class="form-group col-test-url">
                    <label for="proxy-test-url">连通性测试 URL</label>
                    <input type="url" id="proxy-test-url" placeholder="https://www.google.com">
                </div>
                <div class="form-group col-test-btn">
                     <!-- 按钮放在 URL 右侧，移除 label 标签以对齐输入框 -->
                    <label style="visibility: hidden;">测试</label>
                    <button type="button" class="btn-primary" id="btn-test">测试网络连通性</button>
                </div>
            </div>
        </div>

        <div id="result-message"></div>
    </div>

    <script src="proxy-renderer.js"></script>
</body>
</html>
